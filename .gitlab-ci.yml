image: registry.gitlab.com/fireblocks/shell/infra/images/node-infra-20:latest

variables:
  SHELL_LIBS_PROJECT_ID: 20565764
  FORCE_COLOR: '1'
  IMAGE_TAG: ${CI_COMMIT_SHORT_SHA}
  TEST_NODE_VERSION: "node-18.12.1"
  IS_PROD_SERVICE: "false"
  IS_DEPLOYABLE_SERVICE: "false"
  DD_CIVISIBILITY_AGENTLESS_ENABLED: "false"
  PULL_BEFORE_STOP: "false"
  SKIP_IMAGE_BUILD: "true"
  FORCE_IMAGE_BUILD_FROM_TEMPLATE: "false"
  IS_MULTI_SERVICE_DEPLOYMENT: "false"
  RUN_MESSAGING_LIBRARY_COMPONENT_TESTS: "false"
  RUN_COMPONENT_TESTS: "false"
  CI_DEBUG_SERVICES: "false"
  SKIP_UPDATE_REQUEST: "true"
  SKIP_CHECK_YARN_PROBLEMS: "true"
  SKIP_CHECK_DEPRECATED_PACKAGES: "false"
  SKIP_CHECK_FORBIDDEN_PACKAGES: "false"
  SKIP_TEST: "false"
  GITLAB_RUNNER_TAG: devx-application-gitlab-runner

stages:
  - test
  - lint
  - build

before_script:
  - echo "started installing global dependencies $(date +"%T")"
  - echo "Install yq & jq from .gitlab-ci.yml"
  - apk update
  - apk add jq
  - apk add yq
  - apk add gcompat libstdc++
  - curl -fsSL https://bun.sh/install | bash
  - export BUN_INSTALL="$HOME/.bun"
  - echo "export PATH=\$BUN_INSTALL/bin:\$PATH" >> $HOME/.bashrc
  - echo "finished installing global dependencies $(date +"%T")"
  - echo "Installing foundry dependencies $(date +"%T")"
  - apk add --no-cache curl bash shadow
  - mkdir -p $HOME/.foundry/bin
  - echo "whoami=$(whoami)"
  - echo "shell=$SHELL"
  - echo "Architecture=$(uname -m)"
  - echo "OS=$(uname -s)"
  - printf "Nonroot\nNonroot" | passwd
  - chsh -s /bin/bash
  - echo "whoami=$(whoami)"
  - echo "shell=$SHELL"
  - curl -L https://foundry.paradigm.xyz | bash
  # Manually add to PATH as suggested in the error message
  - source $HOME/.bashrc
  # Run foundryup directly from the path where it was installed
  - chmod +x $HOME/.foundry/bin/foundryup
  # Use sed to modify the case statement around line 121
  # Looking for the 'linux)' case and adding alpine to it
  - sed -i '/case $PLATFORM in/,/esac/ s/linux)/linux|alpine)/' $HOME/.foundry/bin/foundryup
  - echo "Modified foundryup script to support Alpine builds"
  - foundryup --install nightly --platform alpine
  - ls -la  $HOME/.foundry/bin
  # Verify forge is available
  - $HOME/.foundry/bin/forge --version
  - echo "Foundry installation completed $(date +"%T")"

test:coverage:delegate:
  stage: test
  variables:
    GIT_STRATEGY: clone
  tags:
    - ${GITLAB_RUNNER_TAG}
  script:
    - pwd
    # Install dependencies
    - bun install --frozen-lockfile 
    # Run forge coverage and save the output - use bash shell explicitly with PATH set
    - bun run test:coverage | tee coverage_output.txt
    # Format the output for the specific file we want to track
    - grep "src/UniversalGaslessDelegate.sol" coverage_output.txt | tee ugd_coverage.txt
  coverage: '/\| src\/UniversalGaslessDelegate\.sol +\| +([0-9]{1,3}\.[0-9]{2})% /'
  artifacts:
    paths:
      - coverage_output.txt
      - ugd_coverage.txt
    expire_in: 30 days

test:coverage:killswitch:
  stage: test
  variables:
    GIT_STRATEGY: clone
  tags:
    - ${GITLAB_RUNNER_TAG}
  script:
    - pwd
    # Install dependencies
    - bun install --frozen-lockfile 
    # Run forge coverage and save the output - use bash shell explicitly with PATH set
    - bun run test:coverage | tee coverage_output.txt
    # Format the output for the specific file we want to track
    - grep "src/KillSwitch.sol" coverage_output.txt | tee ks_coverage.txt
  coverage: '/\| src\/KillSwitch\.sol +\| +([0-9]{1,3}\.[0-9]{2})% /'
  artifacts:
    paths:
      - coverage_output.txt
      - ks_coverage.txt
    expire_in: 30 days
